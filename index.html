<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>页面导航</title>
  <style>
    :root {
      --bg: #f5efe6;
      --bg-accent: #dbe7f3;
      --panel: rgba(255, 255, 255, 0.78);
      --panel-border: rgba(30, 41, 59, 0.12);
      --text: #1f2937;
      --muted: #5b6472;
      --primary: #0f766e;
      --primary-strong: #115e59;
      --shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(255, 255, 255, 0.85), transparent 32%),
        radial-gradient(circle at bottom right, rgba(15, 118, 110, 0.08), transparent 24%),
        linear-gradient(145deg, var(--bg), var(--bg-accent));
    }

    .page {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 64px 0 48px;
    }

    .hero {
      padding: 32px;
      border: 1px solid var(--panel-border);
      border-radius: calc(var(--radius) + 4px);
      background: var(--panel);
      backdrop-filter: blur(14px);
      box-shadow: var(--shadow);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(15, 118, 110, 0.1);
      color: var(--primary-strong);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    h1 {
      margin: 18px 0 12px;
      font-size: clamp(30px, 5vw, 52px);
      line-height: 1.08;
    }

    .intro {
      max-width: 760px;
      margin: 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.7;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
      margin-top: 28px;
    }

    .card {
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-height: 220px;
      padding: 22px;
      border: 1px solid rgba(15, 23, 42, 0.1);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.88);
      color: inherit;
      text-decoration: none;
      box-shadow: 0 14px 36px rgba(15, 23, 42, 0.08);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .card:hover,
    .card:focus-visible {
      transform: translateY(-4px);
      border-color: rgba(15, 118, 110, 0.28);
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.12);
      outline: none;
    }

    .badge {
      align-self: flex-start;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(15, 118, 110, 0.08);
      color: var(--primary-strong);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .card h2 {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
    }

    .card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.65;
      flex: 1;
    }

    .footer {
      margin-top: 16px;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
    }

    @media (max-width: 640px) {
      .page {
        width: min(100% - 20px, 1120px);
        padding: 24px 0 28px;
      }

      .hero {
        padding: 20px;
        border-radius: 20px;
      }

      .grid {
        gap: 14px;
      }

      .card {
        min-height: auto;
        padding: 18px;
        border-radius: 20px;
      }

      .card h2 {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <span class="eyebrow">Responsive Navigation</span>
      <h1>子页面入口导航</h1>
      <p class="intro">
        这里汇总了当前目录下各个子文件夹的页面入口。桌面端会自动排成多列卡片，
        在手机和平板上会自适应收缩成单列或双列，点击即可进入对应子页面。
      </p>

      <section class="grid" aria-label="子页面列表">
        <a class="card" href="./car/index.html">
          <span class="badge">car</span>
          <h2>Car</h2>
          <p>进入车辆相关子页面。</p>
        </a>

        <a class="card" href="./doc/index.html">
          <span class="badge">doc</span>
          <h2>Doc</h2>
          <p>进入文档展示页面。</p>
        </a>

        <a class="card" href="./hanzi/index.html">
          <span class="badge">hanzi</span>
          <h2>Hanzi</h2>
          <p>进入汉字书写演示页面。</p>
        </a>

        <a class="card" href="./hanzi2/index.html">
          <span class="badge">hanzi2</span>
          <h2>Hanzi 2</h2>
          <p>进入第二个汉字学习页面。</p>
        </a>

        <a class="card" href="./resume/index.html">
          <span class="badge">resume</span>
          <h2>Resume</h2>
          <p>进入简历展示页面。</p>
        </a>

        <a class="card" href="./srt/index.html">
          <span class="badge">srt</span>
          <h2>SRT</h2>
          <p>进入 SRT 时间处理工具页面。</p>
        </a>
      </section>
    </section>

    <p class="footer">已为根目录添加统一导航入口。</p>
  </main>
</body>
</html>
