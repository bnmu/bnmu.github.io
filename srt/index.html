<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SRT 时间提取工具</title>
  <style>
    :root {
      --bg-top: #f3efe5;
      --bg-bottom: #d6e4f0;
      --panel: rgba(255, 252, 247, 0.9);
      --panel-border: rgba(61, 77, 92, 0.14);
      --text: #20303c;
      --muted: #607182;
      --accent: #0f766e;
      --accent-hover: #115e59;
      --shadow: 0 20px 60px rgba(38, 56, 73, 0.14);
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(255, 255, 255, 0.8), transparent 35%),
        linear-gradient(160deg, var(--bg-top), var(--bg-bottom));
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .shell {
      width: min(920px, 100%);
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      backdrop-filter: blur(10px);
    }

    .hero {
      padding: 32px 32px 20px;
      background:
        linear-gradient(135deg, rgba(15, 118, 110, 0.12), rgba(255, 255, 255, 0)),
        linear-gradient(180deg, rgba(255, 255, 255, 0.75), rgba(255, 255, 255, 0.35));
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(28px, 4vw, 42px);
      line-height: 1.1;
      letter-spacing: 0.02em;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
      max-width: 720px;
    }

    .content {
      padding: 24px 32px 32px;
      display: grid;
      gap: 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(61, 77, 92, 0.1);
      border-radius: 20px;
      padding: 20px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    .file-input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .file-picker {
      position: relative;
      flex: 1 1 320px;
      min-height: 84px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 18px;
      border-radius: 20px;
      border: 1px dashed rgba(15, 118, 110, 0.28);
      background:
        linear-gradient(135deg, rgba(15, 118, 110, 0.1), rgba(255, 255, 255, 0.92)),
        rgba(255, 255, 255, 0.96);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.85);
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease;
      overflow: hidden;
    }

    .file-picker:hover {
      transform: translateY(-1px);
      border-color: rgba(15, 118, 110, 0.46);
      box-shadow: 0 12px 28px rgba(15, 118, 110, 0.12);
    }

    .file-picker:focus-within {
      border-color: rgba(15, 118, 110, 0.62);
      box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.14);
    }

    .file-picker.ready {
      border-style: solid;
      border-color: rgba(15, 118, 110, 0.4);
      background:
        linear-gradient(135deg, rgba(15, 118, 110, 0.16), rgba(255, 255, 255, 0.98)),
        rgba(255, 255, 255, 0.98);
    }

    .file-picker-badge {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      font-size: 20px;
      font-weight: 800;
      color: var(--accent);
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(15, 118, 110, 0.16);
      box-shadow: 0 6px 18px rgba(15, 118, 110, 0.1);
    }

    .file-picker-text {
      min-width: 0;
      display: grid;
      gap: 4px;
    }

    .file-picker-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }

    .file-picker-hint,
    .file-picker-name {
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-picker-name {
      color: var(--accent);
      font-weight: 600;
    }

    button,
    .download-link {
      appearance: none;
      border: none;
      border-radius: 999px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.18s ease, background-color 0.18s ease, box-shadow 0.18s ease;
      text-decoration: none;
    }

    button {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 10px 24px rgba(15, 118, 110, 0.22);
    }

    button:hover:not(:disabled),
    .download-link:hover {
      transform: translateY(-1px);
    }

    button:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      box-shadow: none;
    }

    .download-link {
      display: none;
      background: #fff;
      color: var(--accent);
      border: 1px solid rgba(15, 118, 110, 0.18);
    }

    .download-link.ready {
      display: inline-flex;
      align-items: center;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      color: var(--muted);
      font-size: 14px;
    }

    .status {
      margin: 0;
      min-height: 22px;
      color: var(--muted);
      font-size: 14px;
    }

    .status.error {
      color: #b42318;
    }

    .status.success {
      color: #0f766e;
    }

    pre {
      margin: 0;
      max-height: 420px;
      overflow: auto;
      padding: 18px;
      border-radius: 18px;
      background: #18232d;
      color: #ecf6ff;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .rule-list {
      margin: 0;
      padding-left: 18px;
      color: var(--muted);
      line-height: 1.8;
      font-size: 14px;
    }

    @media (max-width: 640px) {
      .hero,
      .content {
        padding-left: 18px;
        padding-right: 18px;
      }

      .controls {
        align-items: stretch;
      }

      button,
      .download-link {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <h1>SRT 字幕清洗工具</h1>
      <p class="subtitle">
        上传原始字幕文件后，网页会保留编号与相对时间，提取第三行里的实际时间，
        并移除 `lat / lon` 行，随后生成保留原扩展名的可下载文件。
      </p>
    </section>

    <section class="content">
      <div class="card">
        <div class="controls">
          <label class="file-picker" id="filePicker" for="fileInput">
            <input id="fileInput" class="file-input" type="file" accept=".srt,text/plain">
            <span class="file-picker-badge">SRT</span>
            <span class="file-picker-text">
              <span class="file-picker-title">选择字幕文件</span>
              <span class="file-picker-hint">点击这里选择要处理的字幕文件</span>
              <span class="file-picker-name" id="pickerFileName">当前未选择文件</span>
            </span>
          </label>
          <button id="processButton" type="button">处理并生成下载文件</button>
          <a id="downloadLink" class="download-link" download>下载处理后文件</a>
        </div>
        <p id="status" class="status">请选择一个要处理的字幕文件。</p>
        <div class="meta">
          <span id="fileName">文件名：未选择</span>
          <span id="blockCount">字幕段数：0</span>
        </div>
      </div>

      <div class="card">
        <ol class="rule-list">
          <li>保留第一行编号，例如 `1`。</li>
          <li>保留第二行相对时间，例如 `00:00:00,000 --> 00:00:01,000`。</li>
          <li>第三行仅保留实际时间，例如 `2026.04.03 08:25:43`。</li>
          <li>删除 `lat: -                              lon: -` 这类行。</li>
        </ol>
      </div>

      <div class="card">
        <pre id="preview">处理结果会显示在这里。</pre>
      </div>
    </section>
  </main>

  <script>
    const fileInput = document.getElementById("fileInput");
    const filePicker = document.getElementById("filePicker");
    const pickerFileName = document.getElementById("pickerFileName");
    const processButton = document.getElementById("processButton");
    const downloadLink = document.getElementById("downloadLink");
    const status = document.getElementById("status");
    const preview = document.getElementById("preview");
    const fileName = document.getElementById("fileName");
    const blockCount = document.getElementById("blockCount");

    let currentDownloadUrl = "";

    function setStatus(message, type = "") {
      status.textContent = message;
      status.className = type ? `status ${type}` : "status";
    }

    function resetDownload() {
      if (currentDownloadUrl) {
        URL.revokeObjectURL(currentDownloadUrl);
        currentDownloadUrl = "";
      }
      downloadLink.classList.remove("ready");
      downloadLink.removeAttribute("href");
      downloadLink.removeAttribute("download");
    }

    function normalizeLineBreaks(text) {
      return text.replace(/\r\n/g, "\n").replace(/\r/g, "\n");
    }

    function getFileExtension(name) {
      const dotIndex = name.lastIndexOf(".");
      return dotIndex > -1 ? name.slice(dotIndex + 1).toLowerCase() : "";
    }

    function getDownloadMimeType(name) {
      const extension = getFileExtension(name);

      switch (extension) {
        case "srt":
          return "application/x-subrip;charset=utf-8";
        case "vtt":
          return "text/vtt;charset=utf-8";
        case "txt":
          return "text/plain;charset=utf-8";
        default:
          return "application/octet-stream";
      }
    }

    function transformBlock(block) {
      const lines = block
        .split("\n")
        .map((line) => line.trimEnd())
        .filter((line) => line.trim() !== "");

      if (lines.length < 3) {
        return null;
      }

      const indexLine = lines[0];
      const timeLine = lines[1];
      const infoLine = lines[2];
      const matchedDateTime = infoLine.match(/(\d{4}\.\d{2}\.\d{2}\s+\d{2}:\d{2}:\d{2})/);
      const actualTime = matchedDateTime ? matchedDateTime[1] : infoLine.trim();

      return [indexLine, timeLine, actualTime].join("\n");
    }

    function processSrtContent(content) {
      const blocks = normalizeLineBreaks(content)
        .split(/\n{2,}/)
        .map((block) => block.trim())
        .filter(Boolean);

      const processedBlocks = blocks
        .map(transformBlock)
        .filter(Boolean);

      return {
        blockTotal: processedBlocks.length,
        output: processedBlocks.join("\n\n") + (processedBlocks.length ? "\n" : "")
      };
    }

    fileInput.addEventListener("change", () => {
      const file = fileInput.files[0];
      resetDownload();

      if (!file) {
        filePicker.classList.remove("ready");
        pickerFileName.textContent = "当前未选择文件";
        fileName.textContent = "文件名：未选择";
        blockCount.textContent = "字幕段数：0";
        preview.textContent = "处理结果会显示在这里。";
        setStatus("请选择一个要处理的字幕文件。");
        return;
      }

      filePicker.classList.add("ready");
      pickerFileName.textContent = file.name;
      fileName.textContent = `文件名：${file.name}`;
      setStatus("文件已选择，可以开始处理。");
    });

    processButton.addEventListener("click", async () => {
      const file = fileInput.files[0];

      if (!file) {
        setStatus("请先选择一个要处理的字幕文件。", "error");
        return;
      }

      resetDownload();
      processButton.disabled = true;
      setStatus("正在处理文件...");

      try {
        const content = await file.text();
        const result = processSrtContent(content);

        if (!result.output.trim()) {
          throw new Error("没有识别到可处理的字幕段。");
        }

        preview.textContent = result.output;
        blockCount.textContent = `字幕段数：${result.blockTotal}`;

        const dotIndex = file.name.lastIndexOf(".");
        const outputName = dotIndex > 0
          ? `${file.name.slice(0, dotIndex)}_processed${file.name.slice(dotIndex)}`
          : `${file.name}_processed`;
        const downloadFile = new File(
          [result.output],
          outputName,
          { type: getDownloadMimeType(outputName) }
        );
        currentDownloadUrl = URL.createObjectURL(downloadFile);

        downloadLink.href = currentDownloadUrl;
        downloadLink.download = outputName;
        downloadLink.classList.add("ready");
        setStatus("处理完成，现在可以下载新文件。", "success");
      } catch (error) {
        preview.textContent = "处理失败，请确认文件格式是否符合示例。";
        blockCount.textContent = "字幕段数：0";
        setStatus(error.message || "处理失败。", "error");
      } finally {
        processButton.disabled = false;
      }
    });
  </script>
</body>
</html>
